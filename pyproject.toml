[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cavi-substance-mcp"
version = "0.5.0"
description = "MCP tools for Substance Painter and Substance 3D Designer"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "numpy>=2.0,<3",
    "pillow>=11.0,<13",
    "pydantic>=2.11,<3",
]

[project.scripts]
cavi-substance-mcp = "cavi_substance_mcp.server:main"
cavi-substance-designer-mcp = "cavi_substance_mcp.designer.server:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_substance_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

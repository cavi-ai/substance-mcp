[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cavi-substance-mcp"
version = "0.6.0"
description = "MCP servers for Adobe Substance 3D Painter, Designer and Sampler"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CAVI AI" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "substance-painter",
    "substance-designer",
    "substance-sampler",
    "pbr",
    "texturing",
    "game-art",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=2.0,<3",
    "pillow>=13.0,<14",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/cavi-ai/substance-mcp#readme"
Repository = "https://github.com/cavi-ai/substance-mcp"
Issues = "https://github.com/cavi-ai/substance-mcp/issues"
Changelog = "https://github.com/cavi-ai/substance-mcp/blob/main/CHANGELOG.md"

[project.scripts]
cavi-substance-mcp = "cavi_substance_mcp.painter.server:main"
cavi-substance-designer-mcp = "cavi_substance_mcp.designer.server:main"
cavi-substance-sampler-mcp = "cavi_substance_mcp.sampler.server:main"
cavi-substance-receipts = "cavi_substance_mcp.receipts_cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_substance_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/evals",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 is enforced once the pre-release format pass wraps existing long lines.
ignore = ["E501"]

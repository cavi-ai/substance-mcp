name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and build only; publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag, version, lockfile and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run from a branch (workflow_dispatch) has no tag to compare; the version
      # sources must still agree with each other.
      - name: Check that the release sources agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            python3 scripts/check_release.py --tag "$REF_NAME"
          else
            python3 scripts/check_release.py
          fi

  build:
    name: build and smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.13"
          # A publish workflow does not restore a cache a pull request could have written.
          enable-cache: false
      # SOURCE_DATE_EPOCH pins the archive timestamps to the commit, so rebuilding the
      # same commit yields the same wheel and sdist.
      - name: Build the wheel and sdist
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
          ls -l dist
      # The exact files that will be uploaded, not a second build.
      - name: Smoke test the built distributions
        run: uv run --locked python scripts/package_smoke.py --dist dist
      - name: Record the checksums
        run: |
          set -euo pipefail
          {
            echo '```'
            (cd dist && sha256sum -- *.whl *.tar.gz)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [verify, build]
    # Only a tag publishes; a manual run publishes only when dry_run is switched off.
    if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named in the PyPI trusted publisher, so it is part of the OIDC claim PyPI matches
    # against. The publisher is cavi-ai / substance-mcp, workflow `release.yml`,
    # environment `pypi`. Renaming this file or dropping the environment stops publishing
    # until the publisher on pypi.org is edited to match.
    environment:
      name: pypi
      url: https://pypi.org/project/cavi-substance-mcp/
    permissions:
      contents: read
      # The whole of the publish credential: PyPI exchanges this OIDC token for a
      # short-lived upload token. No PyPI token is stored in this repository.
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: create the GitHub Release
    needs: [verify, build, publish-pypi]
    if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and attach the distributions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The release body is the CHANGELOG section that verify already proved exists.
      - name: Extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog_section.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

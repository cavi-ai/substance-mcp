name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-guard:
    name: pin-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on main judges every pull request.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  lint:
    name: lint
    needs: [pin-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked ruff check .
      - name: Build and verify the documentation
        run: |
          uv run --locked python -m scripts.docs.build
          uv run --locked python -m scripts.docs.verify

  unit:
    name: unit
    needs: [pin-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests

  evals:
    name: evals
    needs: [pin-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      - run: npm install --no-audit --no-fund
      - run: npm run eval:protocol
      - run: npm run eval:core
      - run: npm run eval:designer-protocol
      - run: npm run eval:designer-core
      - run: npm run eval:sampler-protocol
      - run: npm run eval:sampler-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-eval-reports
          path: |
            .tmp/evals/*/cases.json
            .tmp/evals/*/mcpeval.json
          if-no-files-found: error

  package:
    name: package
    needs: [pin-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv run --locked python scripts/package_smoke.py

  pin-consumers:
    # A green main moves the substance-mcp pin in game-art-pipeline through its pin-servers workflow.
    needs: [lint, unit, evals, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to game-art-pipeline
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/game-art-pipeline/dispatches --method POST -f event_type=server-merged

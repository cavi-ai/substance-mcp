name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  merged-pr:
    name: merged-pr
    # A main push whose exact tree passed this workflow on its merged pull request skips the suite steps.
    # The suite jobs still run and pass, so pin-consumers keeps its needs.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.pr.outputs.tested }}
    steps:
      - id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          [ -n "$head" ] || exit 0
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha || true)
          [ -n "$tree" ] && [ "$tree" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha || true)" ] || exit 0
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=success&head_sha=$head" --jq "[.workflow_runs[] | select(.path == \"${workflow%@*}\")] | length" || echo 0)
          if [ "$passed" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; fi

  pin-guard:
    name: pin-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on main judges every pull request.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  lint:
    name: lint
    needs: [pin-guard, merged-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: "3.15"
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv sync --locked --dev
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked ruff check .
      - name: Build and verify the documentation
        if: needs.merged-pr.outputs.tested != 'true'
        run: |
          uv run --locked python -m scripts.docs.build
          uv run --locked python -m scripts.docs.verify

  unit:
    name: unit
    needs: [pin-guard, merged-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: "3.15"
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv sync --locked --dev
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python -m unittest discover -s tests

  evals:
    name: evals
    needs: [pin-guard, merged-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          node-version: "22"
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv sync --locked --dev
      - name: Build MCP Eval from main
        if: needs.merged-pr.outputs.tested != 'true'
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/mcp-eval/.crates2.json" >> "$GITHUB_ENV" <<'PYTHON'
          import json
          import re
          import sys
          with open(sys.argv[1]) as stream:
              installed = json.load(stream)["installs"]
          source = next(key for key in installed if key.startswith("mcpeval "))
          revision = source.rsplit("#", 1)[1].removesuffix(")")
          assert re.fullmatch("[0-9a-f]{40}", revision), source
          print(f"MCPEVAL_SOURCE_REVISION={revision}")
          PYTHON
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/.crates2.json" .tmp/evals/evaluator/cargo-install.json
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:protocol
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:core
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:designer-protocol
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:designer-core
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:sampler-protocol
      - if: needs.merged-pr.outputs.tested != 'true'
        run: npm run eval:sampler-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.merged-pr.outputs.tested != 'true'
        with:
          name: mcp-eval-reports
          path: |
            .tmp/evals/*/cases.json
            .tmp/evals/*/mcpeval.json
            .tmp/evals/*/evaluator.json
            .tmp/evals/evaluator/cargo-install.json
          if-no-files-found: error

  package:
    name: package
    needs: [pin-guard, merged-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # tags give the version and the documented release
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: "3.15"
      - if: needs.merged-pr.outputs.tested != 'true'
        run: uv run --locked python scripts/package_smoke.py

  pin-consumers:
    # A green main moves the substance-mcp pin in game-art-pipeline through its pin-servers workflow.
    needs: [lint, unit, evals, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to game-art-pipeline
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/game-art-pipeline/dispatches --method POST -f event_type=server-merged

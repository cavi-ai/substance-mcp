name: pin-integrity
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  pin-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # main's guard reads the pull request's commits as data; no pull request code runs here.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch -q origin "+refs/pull/$NUMBER/head:refs/remotes/pull/head"
          python3 scripts/pin_guard.py --mechanism "$BASE" "$HEAD"

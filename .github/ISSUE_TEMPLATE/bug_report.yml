name: Bug report
description: A defect in the Painter, Designer or Sampler server, the Sampler batch CLI, or the receipts CLI
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Adobe assets, templates or Substance project files. For a security
        vulnerability, use a private security advisory instead of an issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Painter server
        - Designer server
        - Sampler server
        - Sampler batch CLI
        - Receipts CLI
        - Docs
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Tool name and arguments, CLI command, or MCP request
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message and the output of `painter_status`, `designer_status` or `sampler_status`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, Python version, uv version, Adobe application and version
    validations:
      required: true
